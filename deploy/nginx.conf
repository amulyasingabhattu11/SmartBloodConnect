# deploy/nginx.conf
# Nginx site config: reverse-proxy port 80 → Node/Express on port 5000.
#
# Installation on the instance:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ruby
#   sudo ln -sf /etc/nginx/sites-available/ruby /etc/nginx/sites-enabled/ruby
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS is handled by CloudFront (viewer → CloudFront over HTTPS;
# CloudFront → EC2 over plain HTTP on port 80).
# The security group must restrict port 80 inbound to CloudFront only.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Large bodies for JSON POST requests (matches express limit of 1mb).
    client_max_body_size 2m;

    # Pass all traffic to the Node/Express app.
    location / {
        proxy_pass http://127.0.0.1:5000;

        # Forward the original client IP; Express reads this via
        # req.ip thanks to app.set('trust proxy', 2).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Keep-alive to the upstream (reduces TCP handshake overhead).
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Reasonable timeouts for API requests.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
