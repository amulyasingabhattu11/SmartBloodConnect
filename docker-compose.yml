services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ruby-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ruby_blood
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ruby-postgres-data:/var/lib/postgresql/data

volumes:
  ruby-postgres-data:
