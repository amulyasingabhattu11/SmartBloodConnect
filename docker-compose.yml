services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ruby-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ruby_blood
      # User and password read from environment; never hard-coded.
      # Set DB_PASSWORD in /opt/ruby/.env (render-env.sh writes it from SSM).
      POSTGRES_USER: ruby
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Bind to loopback only — port 5432 must NOT be reachable from the internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - ruby-postgres-data:/var/lib/postgresql/data

volumes:
  ruby-postgres-data:
